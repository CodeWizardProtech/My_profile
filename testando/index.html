<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.borda-brilhante {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  position: relative;
  background: #111111dc;
  padding: 12px;

}

.borda-brilhante::before {
  content: "";
  position: absolute;
  top: -12px;
  left: -12px;
  width: calc(100% + 24px);
  height: calc(100% + 24px);
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    transparent 0deg,
    rgba(255,255,255,0.9) 90deg,
    transparent 180deg,
    rgba(255,255,255,0.9) 270deg,
    transparent 360deg
  );
  animation: brilho 12s ease-in-out infinite;
  z-index: 0;
  opacity: 0;
  filter: blur(30px);
}

.borda-brilhante img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  position: relative;
  z-index: 1;
}

@keyframes brilho {
  0% {
    transform: rotate(0deg);
    opacity: 0;
  }
  10% {
    opacity: 0.8;
  }
  50% {
    transform: rotate(360deg);
    opacity: 0.8;
  }
  60% {
    opacity: 0;
  }
  100% {
    transform: rotate(360deg);
    opacity: 0;
  }
}



</style>
<body>
 <div class="borda-brilhante">
  <img src="../marcos.jpg" alt="Minha Foto">
</div>
    
</body>
</html>
